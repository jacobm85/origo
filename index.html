<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<meta http-equiv="X-UA-Compatible" content="IE=Edge;chrome=1">
	<!-- On production systems a Content-Security-Policy and referrer meta-tag should be added, see below.
	The CSP should be modified with adding specific sources that should be allowed, f.e. connect-src 'self' webanalysis.example.com geospatialdata.example.com; -->
	<!-- <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src * data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self';">
	<meta name="referrer" content="same-origin"> -->
	<title>Origo exempel</title>
	<link href="css/style.css" rel="stylesheet">
	<link rel="shortcut icon" href="img/png/logo.png">
	<style>
		/* Matches Origo's .control/.top-right styling so the panel and round button
		   align exactly with the hamburger menu (top:1rem right:1rem, 2.125rem tall,
		   border-radius:0.5rem, box-shadow:0 4px 6px 0 hsla(0,0%,0%,0.2)).
		   z-index matches Origo's .control (50) so the mapmenu popup
		   (.z-index-top = 100) can correctly draw on top. */
		#filter-panel {
			position: absolute;
			top: 1rem;
			right: 3.625rem; /* 1rem (top-right offset) + 2.125rem (button width) + 0.5rem (gap) */
			z-index: 50;
			pointer-events: auto;
			background: #ffffff;
			border-radius: 0.5rem;
			box-shadow: 0 4px 6px 0 hsla(0, 0%, 0%, 0.2);
			font-family: sans-serif;
			font-size: 0.85rem;
			color: #333;
			min-width: 16rem;
			max-width: 22rem;
			max-height: calc(100vh - 2rem);
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}
		#filter-panel .filter-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.4rem;
			padding: 0.5rem 0.7rem;
			cursor: pointer;
			user-select: none;
			background: #f7f7f7;
			border-bottom: 1px solid #e0e0e0;
		}
		#filter-panel .filter-header:hover { background: #efefef; }
		#filter-panel .filter-header-title {
			font-weight: 700;
			font-size: 0.8rem;
			color: #555;
			text-transform: uppercase;
			letter-spacing: 0.03em;
		}
		#filter-panel .filter-header-chevron {
			color: #888;
			font-size: 0.9rem;
			line-height: 1;
			transition: transform 0.15s ease;
		}
		#filter-panel .filter-icon {
			display: none;
			width: 1.125rem;
			height: 1.125rem;
			color: #555;
			flex: 0 0 auto;
		}
		#filter-panel .filter-body {
			padding: 0.5rem 0.7rem;
			overflow-y: auto;
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		/* Collapsed -> round button identical to Origo's hamburger button.
		   Origo uses .medium.round (padding:0.5rem) + .icon-smaller (1.125rem icon)
		   = total 2.125rem square. */
		#filter-panel.is-collapsed {
			min-width: 0;
			max-width: none;
			width: auto;
			background: transparent;
			border-radius: 50%;
			overflow: visible;
		}
		#filter-panel.is-collapsed .filter-body { display: none; }
		#filter-panel.is-collapsed .filter-header {
			padding: 0.5rem;
			background: #ffffff;
			border-bottom: none;
			border-radius: 50%;
			justify-content: center;
		}
		#filter-panel.is-collapsed .filter-header:hover { background: #f5f5f5; }
		#filter-panel.is-collapsed .filter-header-title,
		#filter-panel.is-collapsed .filter-header-chevron { display: none; }
		#filter-panel.is-collapsed .filter-icon { display: block; }

		/* Tooltip on hover when collapsed - mirrors Origo's data-placement=west
		   tooltip used by the hamburger menu button. */
		#filter-panel .filter-tooltip {
			position: absolute;
			top: 50%;
			right: calc(100% + 0.4rem);
			transform: translateY(-50%);
			background: rgba(51, 51, 51, 0.85);
			color: #fff;
			padding: 6px 10px;
			border-radius: 4px;
			font-size: 0.875rem;
			line-height: 1;
			white-space: nowrap;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.2s ease;
		}
		#filter-panel.is-collapsed .filter-header:hover .filter-tooltip,
		#filter-panel.is-collapsed .filter-header:focus-visible .filter-tooltip {
			opacity: 1;
		}
		#filter-panel:not(.is-collapsed) .filter-tooltip { display: none; }
		#filter-panel .filter-section {
			display: flex;
			flex-direction: column;
			gap: 0.35rem;
			padding-bottom: 0.5rem;
			border-bottom: 1px solid #e0e0e0;
		}
		#filter-panel .filter-section:last-child {
			border-bottom: none;
			padding-bottom: 0;
		}
		#filter-panel .filter-section-title {
			font-weight: 700;
			font-size: 0.8rem;
			color: #555;
			text-transform: uppercase;
			letter-spacing: 0.03em;
		}
		#filter-panel .filter-row {
			display: flex;
			align-items: center;
			gap: 0.4rem;
		}
		#filter-panel label {
			flex: 0 0 6rem;
			font-weight: 600;
		}
		#filter-panel select,
		#filter-panel input[type="date"] {
			border: 1px solid #ccc;
			border-radius: 3px;
			padding: 0.2rem 0.4rem;
			background: #fff;
			font: inherit;
			min-width: 0;
		}
		#filter-panel select {
			flex: 1;
		}
		#filter-panel .filter-date-range {
			flex: 1;
			display: flex;
			align-items: center;
			gap: 0.3rem;
		}
		#filter-panel .filter-date-range input[type="date"] {
			flex: 1;
			min-width: 0;
		}
		#filter-panel .filter-date-range span {
			color: #888;
		}
		#filter-panel button.filter-reset {
			background: none;
			border: 1px solid #ccc;
			border-radius: 3px;
			padding: 0.15rem 0.5rem;
			font: inherit;
			color: #555;
			cursor: pointer;
		}
		#filter-panel button.filter-reset:hover {
			background: #f0f0f0;
		}
		#filter-panel .filter-footer {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 0.5rem;
		}
		#filter-panel .filter-count {
			color: #888;
			font-size: 0.75rem;
			text-align: right;
		}

		/* ---- Layer search (top-center) ------------------------------------ */
		#layer-search {
			position: absolute;
			top: 1rem;
			left: 50%;
			transform: translateX(-50%);
			z-index: 50;
			width: min(28rem, calc(100vw - 8rem));
			font-family: sans-serif;
			pointer-events: auto;
		}
		#layer-search .ls-inputwrap {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			height: 2.125rem;
			padding: 0 0.6rem;
			background: #ffffff;
			border-radius: 0.5rem;
			box-shadow: 0 4px 6px 0 hsla(0, 0%, 0%, 0.2);
		}
		#layer-search .ls-search-icon {
			width: 1.05rem;
			height: 1.05rem;
			color: #888;
			flex: 0 0 auto;
		}
		#layer-search input {
			flex: 1;
			min-width: 0;
			border: none;
			outline: none;
			background: transparent;
			font: inherit;
			font-size: 0.9rem;
			color: #333;
		}
		#layer-search .ls-clear {
			display: none;
			flex: 0 0 auto;
			border: none;
			background: none;
			padding: 0 0.2rem;
			font-size: 1.15rem;
			line-height: 1;
			color: #999;
			cursor: pointer;
		}
		#layer-search .ls-clear:hover { color: #555; }
		#layer-search .ls-spinner {
			display: none;
			flex: 0 0 auto;
			width: 0.9rem;
			height: 0.9rem;
			border: 2px solid #d4d4d4;
			border-top-color: #4c96e0;
			border-radius: 50%;
			animation: ls-spin 0.7s linear infinite;
		}
		#layer-search.is-loading .ls-spinner { display: block; }
		@keyframes ls-spin { to { transform: rotate(360deg); } }
		#layer-search .ls-results {
			display: none;
			margin-top: 0.35rem;
			background: #ffffff;
			border-radius: 0.5rem;
			box-shadow: 0 4px 6px 0 hsla(0, 0%, 0%, 0.2);
			max-height: min(60vh, 28rem);
			overflow-y: auto;
		}
		#layer-search.has-results .ls-results { display: block; }
		#layer-search .ls-item {
			display: flex;
			flex-direction: column;
			gap: 0.1rem;
			padding: 0.45rem 0.7rem;
			border-bottom: 1px solid #f0f0f0;
			cursor: pointer;
		}
		#layer-search .ls-item:last-child { border-bottom: none; }
		#layer-search .ls-item:hover,
		#layer-search .ls-item.is-active { background: #eef5fd; }
		#layer-search .ls-item-label {
			font-size: 0.85rem;
			font-weight: 600;
			color: #222;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#layer-search .ls-item-label mark {
			background: #ffe9a8;
			color: inherit;
			padding: 0 1px;
			border-radius: 2px;
		}
		#layer-search .ls-item-snippet {
			font-size: 0.76rem;
			color: #555;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#layer-search .ls-item-snippet mark {
			background: #ffe9a8;
			color: inherit;
			padding: 0 1px;
			border-radius: 2px;
		}
		#layer-search .ls-item-layer {
			font-size: 0.72rem;
			color: #7a8aa0;
			text-transform: uppercase;
			letter-spacing: 0.02em;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#layer-search .ls-group {
			position: sticky;
			top: 0;
			z-index: 1;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.5rem;
			padding: 0.35rem 0.7rem;
			background: #f4f7fb;
			border-bottom: 1px solid #e3e9f1;
			font-size: 0.72rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.02em;
			color: #5a6a82;
		}
		#layer-search .ls-group-title {
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#layer-search .ls-group-count {
			flex: 0 0 auto;
			min-width: 1.2rem;
			padding: 0 0.35rem;
			border-radius: 0.6rem;
			background: #d8e3f1;
			color: #44597a;
			text-align: center;
		}
		#layer-search .ls-empty,
		#layer-search .ls-more {
			padding: 0.6rem 0.7rem;
			font-size: 0.8rem;
			color: #888;
			text-align: center;
		}
		#layer-search .ls-more { border-top: 1px solid #f0f0f0; }
	</style>
</head>
<body>
<div id="app-wrapper"></div>
<div id="layer-search" role="search">
	<div class="ls-inputwrap">
		<svg class="ls-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<circle cx="11" cy="11" r="7"></circle>
			<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
		</svg>
		<input id="layer-search-input" type="text" autocomplete="off" spellcheck="false"
				placeholder="Sök i kartans lager…" aria-label="Sök i kartans lager"
				role="combobox" aria-expanded="false" aria-controls="layer-search-results" aria-autocomplete="list">
		<span class="ls-spinner" aria-hidden="true"></span>
		<button type="button" class="ls-clear" id="layer-search-clear" aria-label="Rensa sökning">×</button>
	</div>
	<div class="ls-results" id="layer-search-results" role="listbox" aria-label="Sökträffar"></div>
</div>
<div id="filter-panel">
	<div class="filter-header" role="button" tabindex="0" aria-expanded="true" aria-controls="filter-panel-body" aria-label="Visa/dölj filter"
			onclick="(function(p){var c=p.classList.toggle('is-collapsed');p.querySelector('.filter-header').setAttribute('aria-expanded',c?'false':'true');try{localStorage.setItem('origo-filter-panel-collapsed',c?'1':'0')}catch(e){}})(document.getElementById('filter-panel'))"
			onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}">
		<svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
		</svg>
		<span class="filter-header-title">Filter</span>
		<span class="filter-header-chevron" aria-hidden="true">▼</span>
		<span class="filter-tooltip" role="tooltip">Filtrera lager</span>
	</div>
	<div class="filter-body" id="filter-panel-body">
	<div class="filter-section">
		<div class="filter-section-title">Avverkningsanmälningar</div>
		<div class="filter-row">
			<label for="avv-filter-year">Ärendeår:</label>
			<select id="avv-filter-year">
				<option value="all">Alla år</option>
			</select>
		</div>
		<div class="filter-row">
			<label for="avv-filter-andamal">Ändamål:</label>
			<select id="avv-filter-andamal">
				<option value="all">Alla ändamål</option>
			</select>
		</div>
		<div class="filter-row">
			<label for="avv-filter-date-from">Inkomstdatum:</label>
			<div class="filter-date-range">
				<input type="date" id="avv-filter-date-from" aria-label="Från datum">
				<span>–</span>
				<input type="date" id="avv-filter-date-to" aria-label="Till datum">
			</div>
		</div>
		<div class="filter-footer">
			<button type="button" class="filter-reset" id="avv-filter-reset">Återställ</button>
			<span class="filter-count" id="avv-filter-count"></span>
		</div>
	</div>

	<div class="filter-section">
		<div class="filter-section-title">Prospektering &amp; gruvbrytning</div>
		<div class="filter-row">
			<label for="am-filter-date-from">Beg.&nbsp;datum:</label>
			<div class="filter-date-range">
				<input type="date" id="am-filter-date-from" aria-label="Från datum">
				<span>–</span>
				<input type="date" id="am-filter-date-to" aria-label="Till datum">
			</div>
		</div>
		<div class="filter-footer">
			<button type="button" class="filter-reset" id="am-filter-reset">Återställ</button>
			<span class="filter-count">filtrerar designation_period_begin serverside</span>
		</div>
	</div>
	</div>
</div>
<script src="js/origo.js"></script>
<script type="text/javascript">
	var origo = Origo('index.json');

	// Restore the panel's collapsed state from a previous session.
	(function () {
		var panel = document.getElementById('filter-panel');
		if (!panel) return;
		try {
			if (localStorage.getItem('origo-filter-panel-collapsed') === '1') {
				panel.classList.add('is-collapsed');
				panel.querySelector('.filter-header').setAttribute('aria-expanded', 'false');
			}
		} catch (e) {}
	})();

	origo.on('load', function (viewer) {
		// Move the filter panel into Origo's main map container so it
		// shares the stacking context with Origo's own controls. Otherwise
		// the panel sits at the document root and any z-index it gets
		// renders above every descendant of #app-wrapper (including the
		// mapmenu popup at z-index:100).
		var panel = document.getElementById('filter-panel');
		var host = viewer.getMain && viewer.getMain().getId
			? document.getElementById(viewer.getMain().getId())
			: document.querySelector('.o-map') || document.getElementById('app-wrapper');
		if (panel && host && panel.parentNode !== host) host.appendChild(panel);

		var searchBox = document.getElementById('layer-search');
		if (searchBox && host && searchBox.parentNode !== host) host.appendChild(searchBox);

		setupLayerSearch(viewer);
		setupAvverkningsanmalanFilter(viewer);
		setupAmProspekteringFilter(viewer);
	});

	// Free-text search across every client-side vector (GeoJSON) layer.
	// Hits zoom the map to the feature, turn its layer on and open the same
	// feature-info popup you get from clicking the map.
	function setupLayerSearch(viewer) {
		var box = document.getElementById('layer-search');
		var input = document.getElementById('layer-search-input');
		var resultsEl = document.getElementById('layer-search-results');
		var clearBtn = document.getElementById('layer-search-clear');
		if (!box || !input || !resultsEl) return;

		var featureInfo = viewer.getControlByName('featureInfo');
		var MIN_CHARS = 2;
		var PER_LAYER_LIMIT = 8;   // top hits shown per layer group
		var MAX_RESULTS = 120;     // overall safety cap across all groups
		var currentResults = [];
		var layerTotals = {};
		var activeIndex = -1;

		// A cluster layer's source wraps the real vector source; unwrap it so
		// we read the individual features rather than the cluster bubbles.
		function getVectorSource(layer) {
			var s = layer.getSource && layer.getSource();
			if (!s) return null;
			if (typeof s.getSource === 'function' && s.getSource()) s = s.getSource();
			return (s && typeof s.getFeatures === 'function') ? s : null;
		}

		function getSearchableLayers() {
			return viewer.getLayersByProperty('type', 'GEOJSON');
		}

		// GeoJSON sources load lazily on first render, so a hidden layer has no
		// features yet. Trigger the loader and resolve once features arrive.
		function ensureLoaded(layer) {
			return new Promise(function (resolve) {
				var src = getVectorSource(layer);
				if (!src) { resolve([]); return; }
				if (src.getFeatures().length) { resolve(src.getFeatures()); return; }
				var view = viewer.getMap().getView();
				var proj = view.getProjection();
				try { src.loadFeatures(proj.getExtent(), view.getResolution() || 1, proj); } catch (e) {}
				var tries = 0;
				var iv = setInterval(function () {
					tries += 1;
					if (src.getFeatures().length || tries > 40) {
						clearInterval(iv);
						resolve(src.getFeatures());
					}
				}, 150);
			});
		}

		// Warm up every searchable layer in the background so the first query
		// is instant even for layers the user hasn't switched on.
		var preloading = getSearchableLayers().map(ensureLoaded);
		box.classList.add('is-loading');
		Promise.all(preloading).then(function () {
			box.classList.remove('is-loading');
			if (input.value.trim().length >= MIN_CHARS) runSearch(input.value);
		});

		function attributeNames(layer) {
			var attrs = layer.get('attributes');
			if (Array.isArray(attrs) && attrs.length) {
				return attrs.map(function (a) { return a.name; }).filter(Boolean);
			}
			return null;
		}

		function valueFields(feature, layer) {
			var names = attributeNames(layer);
			if (names) return names;
			return Object.keys(feature.getProperties()).filter(function (k) {
				return k !== feature.getGeometryName();
			});
		}

		// Field names that make a good headline for a result, in priority order.
		var TITLE_HINTS = ['rubrik', 'title', 'titel', 'namn', 'name', 'projekt', 'beteckning', 'arende'];

		function attrTitle(layer, name) {
			var attrs = layer.get('attributes');
			if (Array.isArray(attrs)) {
				for (var i = 0; i < attrs.length; i++) {
					if (attrs[i].name === name) return attrs[i].title || name;
				}
			}
			return name;
		}

		function hasValue(v) { return v !== undefined && v !== null && String(v).trim() !== ''; }

		function featureLabel(feature, layer) {
			var fields = valueFields(feature, layer);
			for (var h = 0; h < TITLE_HINTS.length; h++) {
				for (var i = 0; i < fields.length; i++) {
					if (fields[i].toLowerCase().indexOf(TITLE_HINTS[h]) !== -1 && hasValue(feature.get(fields[i]))) {
						return String(feature.get(fields[i]));
					}
				}
			}
			for (var j = 0; j < fields.length; j++) {
				if (hasValue(feature.get(fields[j]))) return String(feature.get(fields[j]));
			}
			return '(utan namn)';
		}

		// The first attribute whose value actually contains the query, so the
		// result can show the user why it matched.
		function matchedField(feature, layer, query) {
			var fields = valueFields(feature, layer);
			for (var i = 0; i < fields.length; i++) {
				var v = feature.get(fields[i]);
				if (v !== undefined && v !== null && String(v).toLowerCase().indexOf(query) !== -1) {
					return { title: attrTitle(layer, fields[i]), value: String(v) };
				}
			}
			return null;
		}

		function searchableText(feature, layer) {
			var fields = valueFields(feature, layer);
			var parts = [];
			for (var i = 0; i < fields.length; i++) {
				var v = feature.get(fields[i]);
				if (v !== undefined && v !== null) parts.push(String(v));
			}
			return parts.join('  ').toLowerCase();
		}

		function escapeHtml(s) {
			return s.replace(/[&<>"]/g, function (c) {
				return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
			});
		}

		function highlight(label, query) {
			var lower = label.toLowerCase();
			var idx = lower.indexOf(query);
			if (idx === -1) return escapeHtml(label);
			return escapeHtml(label.slice(0, idx))
				+ '<mark>' + escapeHtml(label.slice(idx, idx + query.length)) + '</mark>'
				+ escapeHtml(label.slice(idx + query.length));
		}

		// Highlight the match inside a (possibly long) value, trimmed to a
		// window of context around the match with leading/trailing ellipses.
		function highlightSnippet(value, query) {
			var lower = value.toLowerCase();
			var idx = lower.indexOf(query);
			if (idx === -1) {
				return escapeHtml(value.length > 80 ? value.slice(0, 80) + '…' : value);
			}
			var ctx = 30;
			var start = Math.max(0, idx - ctx);
			var end = Math.min(value.length, idx + query.length + ctx);
			return (start > 0 ? '…' : '')
				+ highlight(value.slice(start, end), query)
				+ (end < value.length ? '…' : '');
		}

		function runSearch(raw) {
			var query = raw.trim().toLowerCase();
			currentResults = [];
			layerTotals = {};
			activeIndex = -1;
			if (query.length < MIN_CHARS) { renderResults(query, 0); return; }
			var layers = getSearchableLayers();
			var totalHits = 0;
			// Iterate layer by layer so currentResults stays grouped by layer,
			// which lets renderResults emit one header per layer in order.
			for (var li = 0; li < layers.length; li++) {
				var layer = layers[li];
				var src = getVectorSource(layer);
				if (!src) continue;
				var feats = src.getFeatures();
				var inLayer = 0;
				for (var fi = 0; fi < feats.length; fi++) {
					if (searchableText(feats[fi], layer).indexOf(query) === -1) continue;
					totalHits += 1;
					inLayer += 1;
					// Cap per layer so one big layer can't crowd out the others.
					if (inLayer <= PER_LAYER_LIMIT && currentResults.length < MAX_RESULTS) {
						currentResults.push({ feature: feats[fi], layer: layer });
					}
				}
				if (inLayer) layerTotals[layer.get('name')] = inLayer;
			}
			renderResults(query, totalHits);
		}

		function renderResults(query, totalHits) {
			resultsEl.innerHTML = '';
			if (query.length < MIN_CHARS) {
				box.classList.remove('has-results');
				input.setAttribute('aria-expanded', 'false');
				return;
			}
			if (!currentResults.length) {
				resultsEl.innerHTML = '<div class="ls-empty">Inga träffar</div>';
				box.classList.add('has-results');
				input.setAttribute('aria-expanded', 'true');
				return;
			}
			var frag = document.createDocumentFragment();
			var lastLayerName = null;
			currentResults.forEach(function (hit, idx) {
				var layerName = hit.layer.get('name');
				if (layerName !== lastLayerName) {
					lastLayerName = layerName;
					var header = document.createElement('div');
					header.className = 'ls-group';
					header.innerHTML = '<span class="ls-group-title"></span><span class="ls-group-count"></span>';
					header.querySelector('.ls-group-title').textContent = hit.layer.get('title') || layerName;
					var total = layerTotals[layerName] || 0;
					var shown = Math.min(total, PER_LAYER_LIMIT);
					header.querySelector('.ls-group-count').textContent = total > shown ? (shown + '/' + total) : String(total);
					frag.appendChild(header);
				}
				var item = document.createElement('div');
				item.className = 'ls-item';
				item.setAttribute('role', 'option');
				item.dataset.idx = idx;
				var labelText = featureLabel(hit.feature, hit.layer);
				var match = matchedField(hit.feature, hit.layer, query);
				var html = '<span class="ls-item-label">' + highlight(labelText, query) + '</span>';
				if (match && match.value !== labelText) {
					html += '<span class="ls-item-snippet">' + escapeHtml(match.title) + ': '
						+ highlightSnippet(match.value, query) + '</span>';
				}
				item.innerHTML = html;
				item.addEventListener('mousedown', function (e) {
					e.preventDefault(); // keep focus in the input
					gotoResult(hit);
				});
				item.addEventListener('mouseenter', function () { setActive(idx); });
				frag.appendChild(item);
			});
			if (totalHits > currentResults.length) {
				var more = document.createElement('div');
				more.className = 'ls-more';
				more.textContent = 'Visar ' + currentResults.length + ' av ' + totalHits
					+ ' träffar – förfina sökningen';
				frag.appendChild(more);
			}
			resultsEl.appendChild(frag);
			box.classList.add('has-results');
			input.setAttribute('aria-expanded', 'true');
		}

		function setActive(idx) {
			var items = resultsEl.querySelectorAll('.ls-item');
			if (activeIndex >= 0 && items[activeIndex]) items[activeIndex].classList.remove('is-active');
			activeIndex = idx;
			if (activeIndex >= 0 && items[activeIndex]) {
				items[activeIndex].classList.add('is-active');
				items[activeIndex].scrollIntoView({ block: 'nearest' });
			}
		}

		function gotoResult(hit) {
			if (!hit.layer.getVisible()) hit.layer.setVisible(true);
			if (featureInfo && typeof featureInfo.showFeatureInfo === 'function') {
				featureInfo.showFeatureInfo(
					{ layerName: hit.layer.get('name'), feature: hit.feature },
					{ maxZoomLevel: 10 }
				);
			} else {
				try { viewer.zoomToExtent(hit.feature.getGeometry(), 10); } catch (e) {}
			}
			box.classList.remove('has-results');
			input.setAttribute('aria-expanded', 'false');
		}

		var debounce;
		input.addEventListener('input', function () {
			clearBtn.style.display = input.value ? 'block' : 'none';
			clearTimeout(debounce);
			debounce = setTimeout(function () { runSearch(input.value); }, 200);
		});

		input.addEventListener('keydown', function (e) {
			if (e.key === 'ArrowDown') {
				e.preventDefault();
				if (currentResults.length) setActive((activeIndex + 1) % currentResults.length);
			} else if (e.key === 'ArrowUp') {
				e.preventDefault();
				if (currentResults.length) setActive((activeIndex - 1 + currentResults.length) % currentResults.length);
			} else if (e.key === 'Enter') {
				var pick = activeIndex >= 0 ? currentResults[activeIndex] : currentResults[0];
				if (pick) gotoResult(pick);
			} else if (e.key === 'Escape') {
				clearSearch();
			}
		});

		function clearSearch() {
			input.value = '';
			clearBtn.style.display = 'none';
			currentResults = [];
			activeIndex = -1;
			resultsEl.innerHTML = '';
			box.classList.remove('has-results');
			input.setAttribute('aria-expanded', 'false');
		}

		clearBtn.addEventListener('click', function () { clearSearch(); input.focus(); });
		input.addEventListener('focus', function () {
			if (currentResults.length) { box.classList.add('has-results'); }
		});
		document.addEventListener('mousedown', function (e) {
			if (!box.contains(e.target)) {
				box.classList.remove('has-results');
				input.setAttribute('aria-expanded', 'false');
			}
		});
	}

	function setupAvverkningsanmalanFilter(viewer) {
		var layerName = 'Avverkningsanmalan_Skogsstyrelsen';
		var yearField = 'ArendeAr';
		var purposeField = 'Andamal';
		var dateField = 'Inkomdatum';

		var layer = viewer.getLayer(layerName);
		if (!layer) return;

		var yearSelect = document.getElementById('avv-filter-year');
		var purposeSelect = document.getElementById('avv-filter-andamal');
		var dateFromInput = document.getElementById('avv-filter-date-from');
		var dateToInput = document.getElementById('avv-filter-date-to');
		var resetButton = document.getElementById('avv-filter-reset');
		var countEl = document.getElementById('avv-filter-count');

		var originalStyle = layer.getStyle();
		var selectedYear = 'all';
		var selectedPurpose = 'all';
		var dateFromMs = null;
		var dateToMs = null;
		var dateRangeInitialized = false;

		function toIsoDate(ms) {
			var d = new Date(ms);
			var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
			return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
		}

		function parseDateInputMs(value, endOfDay) {
			if (!value) return null;
			var parts = value.split('-');
			if (parts.length !== 3) return null;
			var y = Number(parts[0]);
			var m = Number(parts[1]) - 1;
			var d = Number(parts[2]);
			return endOfDay
				? new Date(y, m, d, 23, 59, 59, 999).getTime()
				: new Date(y, m, d, 0, 0, 0, 0).getTime();
		}

		function matches(feature) {
			if (selectedYear !== 'all' && feature.get(yearField) !== selectedYear) return false;
			if (selectedPurpose !== 'all' && feature.get(purposeField) !== selectedPurpose) return false;
			var rawDate = feature.get(dateField);
			if (rawDate !== undefined && rawDate !== null && rawDate !== '') {
				var ts = Number(rawDate);
				if (!Number.isNaN(ts)) {
					if (dateFromMs !== null && ts < dateFromMs) return false;
					if (dateToMs !== null && ts > dateToMs) return false;
				}
			} else if (dateFromMs !== null || dateToMs !== null) {
				return false;
			}
			return true;
		}

		layer.setStyle(function (feature, resolution) {
			if (!matches(feature)) return null;
			return typeof originalStyle === 'function'
				? originalStyle(feature, resolution)
				: originalStyle;
		});

		function rebuildOptions(selectEl, values, allLabel, currentValue) {
			var html = '<option value="all">' + allLabel + '</option>';
			values.forEach(function (v) {
				var label = v === '' || v === null ? '(saknas)' : v;
				html += '<option value="' + String(v).replace(/"/g, '&quot;') + '">' + label + '</option>';
			});
			selectEl.innerHTML = html;
			if (currentValue !== 'all') {
				var stringValues = values.map(String);
				if (stringValues.indexOf(String(currentValue)) !== -1) {
					selectEl.value = String(currentValue);
				}
			}
		}

		function refresh() {
			var features = layer.getSource().getFeatures();
			var years = new Set();
			var purposes = new Set();
			var minDate = Infinity;
			var maxDate = -Infinity;
			var matchCount = 0;
			features.forEach(function (f) {
				var y = f.get(yearField);
				if (y !== undefined && y !== null && y !== '') years.add(Number(y));
				var p = f.get(purposeField);
				if (p !== undefined && p !== null) purposes.add(p);
				var ts = Number(f.get(dateField));
				if (!Number.isNaN(ts) && ts > 0) {
					if (ts < minDate) minDate = ts;
					if (ts > maxDate) maxDate = ts;
				}
				if (matches(f)) matchCount += 1;
			});
			var sortedYears = Array.from(years).sort(function (a, b) { return b - a; });
			var sortedPurposes = Array.from(purposes).sort();
			rebuildOptions(yearSelect, sortedYears, 'Alla år', selectedYear);
			rebuildOptions(purposeSelect, sortedPurposes, 'Alla ändamål', selectedPurpose);

			if (minDate !== Infinity && maxDate !== -Infinity) {
				var minIso = toIsoDate(minDate);
				var maxIso = toIsoDate(maxDate);
				dateFromInput.min = minIso;
				dateFromInput.max = maxIso;
				dateToInput.min = minIso;
				dateToInput.max = maxIso;
				if (!dateRangeInitialized) {
					dateFromInput.value = minIso;
					dateToInput.value = maxIso;
					dateRangeInitialized = true;
				}
			}

			countEl.textContent = features.length
				? 'Visar ' + matchCount + ' av ' + features.length
				: 'Zooma in för att hämta data';
		}

		yearSelect.addEventListener('change', function () {
			selectedYear = yearSelect.value === 'all' ? 'all' : Number(yearSelect.value);
			layer.changed();
			refresh();
		});
		purposeSelect.addEventListener('change', function () {
			selectedPurpose = purposeSelect.value === 'all' ? 'all' : purposeSelect.value;
			layer.changed();
			refresh();
		});
		dateFromInput.addEventListener('change', function () {
			dateFromMs = parseDateInputMs(dateFromInput.value, false);
			layer.changed();
			refresh();
		});
		dateToInput.addEventListener('change', function () {
			dateToMs = parseDateInputMs(dateToInput.value, true);
			layer.changed();
			refresh();
		});
		resetButton.addEventListener('click', function () {
			selectedYear = 'all';
			selectedPurpose = 'all';
			yearSelect.value = 'all';
			purposeSelect.value = 'all';
			dateRangeInitialized = false;
			dateFromMs = null;
			dateToMs = null;
			dateFromInput.value = '';
			dateToInput.value = '';
			layer.changed();
			refresh();
		});

		var source = layer.getSource();
		source.on('featuresloadend', refresh);
		source.on('addfeature', refresh);
		refresh();
	}

	function setupAmProspekteringFilter(viewer) {
		var layer = viewer.getLayer('sgu-prospekteringstillstand');
		if (!layer) return;
		var source = layer.getSource();
		if (!source || typeof source.updateParams !== 'function') return;

		var fromInput = document.getElementById('am-filter-date-from');
		var toInput = document.getElementById('am-filter-date-to');
		var resetButton = document.getElementById('am-filter-reset');

		function buildCql() {
			var parts = [];
			if (fromInput.value) parts.push("designation_period_begin >= '" + fromInput.value + "T00:00:00Z'");
			if (toInput.value) parts.push("designation_period_begin <= '" + toInput.value + "T23:59:59Z'");
			return parts.length ? parts.join(' AND ') : 'INCLUDE';
		}

		function apply() {
			source.updateParams({ CQL_FILTER: buildCql() });
		}

		fromInput.addEventListener('change', apply);
		toInput.addEventListener('change', apply);
		resetButton.addEventListener('click', function () {
			fromInput.value = '';
			toInput.value = '';
			apply();
		});
	}
</script>
