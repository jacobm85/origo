<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__LOGIN_TITLE__ – Logga in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a2b3c;
      font-family: system-ui, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 2.5rem 2rem;
      width: 320px;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 .5rem; font-size: 1.4rem; color: #1a2b3c; text-align: center; }
    .subtitle { margin: 0 0 1.5rem; font-size: .9rem; color: #667; text-align: center; }
    .subtitle:empty { display: none; }
    label { display: block; font-size: .85rem; color: #555; margin-bottom: .25rem; }
    input {
      width: 100%; padding: .55rem .75rem; margin-bottom: 1rem;
      border: 1px solid #ccc; border-radius: 4px; font-size: 1rem;
    }
    input:focus { outline: none; border-color: #1a7ab5; }
    button {
      width: 100%; padding: .65rem; background: #1a7ab5; color: #fff;
      border: none; border-radius: 4px; font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #155f8e; }
    .error { color: #c00; font-size: .85rem; text-align: center; margin-bottom: .75rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>__LOGIN_TITLE__</h1>
    <p class="subtitle">__LOGIN_SUBTITLE__</p>
    <form method="POST" action="/auth/login">
      <div id="err" class="error" style="display:none">Fel användarnamn eller lösenord.</div>
      <label for="user">Användarnamn</label>
      <input type="text" id="user" name="user" autocomplete="username" required autofocus>
      <label for="pass">Lösenord</label>
      <input type="password" id="pass" name="pass" autocomplete="current-password" required>
      <button type="submit">Logga in</button>
    </form>
  </div>
  <script>
    if (location.search.includes('error=1'))
      document.getElementById('err').style.display = 'block';
  </script>
</body>
</html>
