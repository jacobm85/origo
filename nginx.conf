server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS for runtime upstream resolution
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # CORS-adding reverse proxy for SGU's GeoServer
    # /proxy/sgu/<workspace>/ows... -> https://maps3.sgu.se/geoserver/<workspace>/ows...
    location /proxy/sgu/ {
        proxy_pass https://maps3.sgu.se/geoserver/;
        proxy_ssl_server_name on;
        proxy_set_header Host maps3.sgu.se;
        proxy_set_header Origin "";
        proxy_set_header User-Agent "origo-proxy/1.0";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }

    # CORS-adding reverse proxy for Lansstyrelsen INSPIRE OWS
    # /proxy/lst/<service>/ows... -> https://ext-geodata-ows.lansstyrelsen.se/<service>/ows...
    location /proxy/lst/ {
        proxy_pass https://ext-geodata-ows.lansstyrelsen.se/;
        proxy_ssl_server_name on;
        proxy_set_header Host ext-geodata-ows.lansstyrelsen.se;
        proxy_set_header Origin "";
        proxy_set_header User-Agent "origo-proxy/1.0";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }
}
