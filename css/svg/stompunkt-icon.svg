<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Stompunkt-pluginen: den klassiska geodetiska triangelsymbolen för en
       triangulerings-/stompunkt – en liksidig triangel med en markerad
       centrumpunkt (själva punktmarkeringen). Egen geometri, viewBox
       0 0 512 512, fylls med currentColor via Origos ikon-styling. -->
  <symbol id="stompunkt-marker" viewBox="0 0 512 512">
    <!-- triangelns kontur (tjock ram, ihålig mitt) -->
    <path d="M256 40 488 452H24L256 40zm0 94L106 404h300L256 134z"/>
    <!-- centrumpunkt = punktmarkeringen -->
    <circle cx="256" cy="330" r="34"/>
  </symbol>
</svg>
