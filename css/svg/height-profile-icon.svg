<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Höjdprofil-pluginen: en terrängprofil – en fylld höjdkurva (berg och
       dalar) över en baslinje, med en L-formad axel och en mätpunkt på en
       topp. Symboliserar just en höjdprofil längs en linje. Egen geometri,
       viewBox 0 0 512 512, fyller med currentColor via Origos ikon-styling. -->
  <symbol id="hp-profile" viewBox="0 0 512 512">
    <!-- L-axel (y nedåt vänster, x längs botten) -->
    <path d="M72 64h28v348h340v28H72V64z"/>
    <!-- fylld terräng-/höjdkurva ovanför baslinjen -->
    <path d="M128 412V300l72-78 64 60 84-130 80 96v164H128z"/>
    <!-- mätpunkt på en brytpunkt (likt avläsningen i diagrammet) -->
    <circle cx="348" cy="164" r="22"/>
  </symbol>
</svg>
