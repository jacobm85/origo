<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Jonosfär-pluginen: klassisk satellit sedd från sidan.
       Centralkropp, två solpanelsvingar (med cellindelning) och en
       parabolantenn/dom upptill. -->
  <symbol id="iono-gps" viewBox="0 0 24 24">
    <!-- vänster solpanel (tre celler) -->
    <rect x="0.8" y="9" width="1.8" height="6"/>
    <rect x="2.9" y="9" width="1.8" height="6"/>
    <rect x="5.0" y="9" width="1.8" height="6"/>
    <!-- höger solpanel (tre celler) -->
    <rect x="17.2" y="9" width="1.8" height="6"/>
    <rect x="19.3" y="9" width="1.8" height="6"/>
    <rect x="21.4" y="9" width="1.8" height="6"/>
    <!-- bommar ut till panelerna -->
    <rect x="6.8" y="11.3" width="2.4" height="1.4"/>
    <rect x="14.8" y="11.3" width="2.4" height="1.4"/>
    <!-- satellitkropp -->
    <rect x="9" y="7.5" width="6" height="9" rx="1.3"/>
    <!-- antennmast -->
    <rect x="11.6" y="3.5" width="0.8" height="4.5"/>
    <!-- parabolantenn (dom) -->
    <path d="M9.6 3.5 A2.4 2.4 0 0 1 14.4 3.5 Z"/>
  </symbol>
</svg>
