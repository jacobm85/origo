<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Drönarflygnings-pluginen: drönare i lätt frontvy med fyra
       propellerskydd (elliptiska ringar), fyra armar och en central
       kropp med kamera. Inspirerad av en klassisk drönarsiluett. -->
  <symbol id="drone-top" viewBox="2 15 116 52">
    <!-- propellerskydd (ringar, annulus via evenodd) -->
    <path fill-rule="evenodd" d="M5 27 a22 9 0 1 0 44 0 a22 9 0 1 0 -44 0 Z M7.5 27 a19.5 6.5 0 1 0 39 0 a19.5 6.5 0 1 0 -39 0 Z"/>
    <path fill-rule="evenodd" d="M71 27 a22 9 0 1 0 44 0 a22 9 0 1 0 -44 0 Z M73.5 27 a19.5 6.5 0 1 0 39 0 a19.5 6.5 0 1 0 -39 0 Z"/>
    <path fill-rule="evenodd" d="M9 57 a20 8 0 1 0 40 0 a20 8 0 1 0 -40 0 Z M11.5 57 a17.5 5.5 0 1 0 35 0 a17.5 5.5 0 1 0 -35 0 Z"/>
    <path fill-rule="evenodd" d="M71 57 a20 8 0 1 0 40 0 a20 8 0 1 0 -40 0 Z M73.5 57 a17.5 5.5 0 1 0 35 0 a17.5 5.5 0 1 0 -35 0 Z"/>
    <!-- armar -->
    <g stroke="#000" stroke-width="3.5" stroke-linecap="round">
      <line x1="51" y1="34" x2="44" y2="31"/>
      <line x1="69" y1="34" x2="76" y2="31"/>
      <line x1="52" y1="50" x2="45" y2="53"/>
      <line x1="68" y1="50" x2="75" y2="53"/>
    </g>
    <!-- motorer -->
    <circle cx="44" cy="31" r="2.6"/>
    <circle cx="76" cy="31" r="2.6"/>
    <circle cx="45" cy="53" r="2.6"/>
    <circle cx="75" cy="53" r="2.6"/>
    <!-- kropp + kamera -->
    <rect x="49" y="29" width="22" height="26" rx="5"/>
    <rect x="56" y="54" width="8" height="6" rx="2"/>
  </symbol>
</svg>
