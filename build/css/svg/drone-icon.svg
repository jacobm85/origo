<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Drönarflygnings-pluginen: quadcopter sedd ovanifrån.
       Korsade armar, fyra motorer med tvåbladiga propellrar och en
       central kropp med kameranos. -->
  <symbol id="drone-top" viewBox="0 0 24 24">
    <!-- armar (X från mitten ut till motorerna) -->
    <path d="M4.0 5.0 L19.0 20.0 L20.0 19.0 L5.0 4.0 Z"/>
    <path d="M20.0 5.0 L5.0 20.0 L4.0 19.0 L19.0 4.0 Z"/>
    <!-- propellrar: tvåbladiga, korsade vid varje motor -->
    <g>
      <ellipse cx="4.5" cy="4.5" rx="3.3" ry="0.95" transform="rotate(45 4.5 4.5)"/>
      <ellipse cx="4.5" cy="4.5" rx="3.3" ry="0.95" transform="rotate(-45 4.5 4.5)"/>
      <ellipse cx="19.5" cy="4.5" rx="3.3" ry="0.95" transform="rotate(45 19.5 4.5)"/>
      <ellipse cx="19.5" cy="4.5" rx="3.3" ry="0.95" transform="rotate(-45 19.5 4.5)"/>
      <ellipse cx="4.5" cy="19.5" rx="3.3" ry="0.95" transform="rotate(45 4.5 19.5)"/>
      <ellipse cx="4.5" cy="19.5" rx="3.3" ry="0.95" transform="rotate(-45 4.5 19.5)"/>
      <ellipse cx="19.5" cy="19.5" rx="3.3" ry="0.95" transform="rotate(45 19.5 19.5)"/>
      <ellipse cx="19.5" cy="19.5" rx="3.3" ry="0.95" transform="rotate(-45 19.5 19.5)"/>
    </g>
    <!-- motorer -->
    <circle cx="4.5" cy="4.5" r="1.3"/>
    <circle cx="19.5" cy="4.5" r="1.3"/>
    <circle cx="4.5" cy="19.5" r="1.3"/>
    <circle cx="19.5" cy="19.5" r="1.3"/>
    <!-- kropp med kameranos -->
    <rect x="9.2" y="9.2" width="5.6" height="5.6" rx="1.4"/>
    <circle cx="12" cy="8.7" r="1"/>
  </symbol>
</svg>
