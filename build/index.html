<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta http-equiv="X-UA-Compatible" content="IE=Edge;chrome=1">
	<meta name="referrer" content="same-origin">
	<!-- Fullskärm när kartan lagts till på hemskärmen (iOS) – ger en plotter
	     utan adressfält i sittbrunnen. -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="mobile-web-app-capable" content="yes">
	<title>Sjökortsplotter</title>
	<link href="css/style.css" rel="stylesheet">
	<link href="plugins/plotter.css" rel="stylesheet">
	<link rel="icon" type="image/svg+xml" href="img/svg/favicon.svg">
	<link rel="alternate icon" href="img/png/logo.png">
	<!-- Runtime-config. Genereras i Docker av /docker-entrypoint.d/30-render-app-config.sh
	     från MAP_TITLE / MAP_FOOTER_TEXT i .env. Saknas filen (lokal utveckling)
	     faller index.html tillbaka på det som står här. -->
	<script src="config.js"></script>
	<script>
		// Applicera fliktiteln direkt så fliken visar rätt text under sidladdning.
		if (window.APP_CONFIG && window.APP_CONFIG.mapTitle) {
			document.title = window.APP_CONFIG.mapTitle;
		}
	</script>
</head>
<body>
<div id="app-wrapper"></div>
<script src="js/origo.js"></script>
<script src="plugins/panel-drag.js"></script>
<script src="plugins/geo-export.js"></script>
<script src="plugins/plotter.js"></script>
<script type="text/javascript">
	// Lägg till plotterns egen ikon-sprite till Origos standarduppsättning.
	// (svgSprites ersätter hela listan, så standardfilerna måste räknas upp.)
	var origo = Origo('index.json', {
		svgSprites: ['fa-icons.svg', 'material-icons.svg', 'miscellaneous.svg', 'origo-icons.svg', 'custom.svg', 'plotter-icon.svg']
	});

	origo.on('load', function (viewer) {
		// Applicera footer-text från APP_CONFIG om satt (MAP_FOOTER_TEXT i .env).
		// Tom sträng = behåll det som står i index.json.
		if (window.APP_CONFIG && typeof window.APP_CONFIG.footerText === 'string'
				&& window.APP_CONFIG.footerText) {
			var footerP = document.querySelector('.o-footer-middle p');
			if (footerP) footerP.textContent = window.APP_CONFIG.footerText;
		}

		// Plugin: Plotter – båtplotter ovanpå sjökortet. Egen position med
		// SOG/COG, spårinspelning, rutter med waypoints, aktiv navigering
		// (DTW/BTW/XTE/VMG/ETA), MOB, ankarvakt, kurs-upp och nattläge.
		if (window.Plotter) {
			viewer.addComponent(Plotter());
		}
	});
</script>
</body>
</html>
