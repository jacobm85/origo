services:
  origo:
    build: .
    image: origo:latest
    container_name: origo
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      # Drönarflygnings-lagret (persondata, utanför git). Generera filen med
      #   python tools/flights_csv_to_geojson.py
      # och lägg den i ./flightdata/ — den serveras då på /flightdata/.
      # En katalog-mount så filen kan uppdateras live utan att bygga om imagen.
      - ./flightdata:/usr/share/nginx/html/flightdata:ro
    depends_on:
      geoserver:
        condition: service_started
      auth:
        condition: service_healthy
      laserdata:
        condition: service_started
      ortofoto:
        condition: service_started
      iono:
        condition: service_started
      lm-oauth:
        condition: service_started
    environment:
      # OAuth2 Bearer token for Lantmateriet's API Portal (apimanager.lantmateriet.se).
      # Injected by nginx into the Authorization header on every /proxy/lantmateriet/*
      # request so the token never leaves the container.
      # Set the real value in a local .env file (see .env.example) — never in git.
      LM_BEARER_TOKEN: "${LM_BEARER_TOKEN:-}"
      # Gemensam Lantmäteri-inloggning. nginx-entrypointen räknar ut Basic Auth
      # (base64) av dessa och injicerar den på /proxy/lm-wmts/ (WMTS-
      # bakgrundskartorna). Faller tillbaka på de gamla service-specifika
      # variablerna om de fortfarande finns i .env.
      LM_USER: "${LM_USER:-${LM_STAC_USER:-}}"
      LM_PASS: "${LM_PASS:-${LM_STAC_PASS:-}}"
      # Klientens fliktitel resp. text i footern. Lämna tom för att behålla
      # värdena från index.html resp. index.json. Renderas till
      # /usr/share/nginx/html/config.js vid containerstart.
      MAP_TITLE: "${MAP_TITLE:-}"
      MAP_FOOTER_TEXT: "${MAP_FOOTER_TEXT:-}"

  # Tiny session-auth service: validates login POSTs and checks session cookies.
  # APP_USER / APP_PASSWORD control login credentials.
  auth:
    image: python:3.12-alpine
    container_name: origo-auth
    restart: unless-stopped
    command: python /auth.py
    volumes:
      - ./auth/auth.py:/auth.py:ro
    environment:
      APP_USER: "${APP_USER:-admin}"
      APP_PASSWORD: "${APP_PASSWORD:-origo}"
    healthcheck:
      # http.client returns a 401 response normally (no cookie) and only
      # raises if the server isn't accepting connections — so any HTTP
      # answer counts as healthy.
      test: ["CMD", "python", "-c", "import http.client as h; c=h.HTTPConnection('localhost',3000,timeout=2); c.request('GET','/auth/check'); c.getresponse()"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Laserdata-backend: söker Lantmäteriets STAC-höjd (punktmoln, LAZ/COPC) för
  # kartvyn och strömmar valda rutor som en zip. nginx proxar /api/laserdata/
  # hit (bakom inloggningen). Basic Auth läggs på server-side så uppgifterna
  # aldrig hamnar i klienten eller i git.
  laserdata:
    build: ./laserdata
    image: origo-laserdata:latest
    container_name: origo-laserdata
    restart: unless-stopped
    environment:
      # Autentisering mot Lantmäteriets STAC-höjd. Två alternativ:
      #  1. OAuth2 (föredras om kontot är API-portal-baserat): consumer key +
      #     secret. Samma applikationsnycklar som lm-oauth-tjänsten – sätt
      #     LASERDATA_OAUTH_* om STAC-höjd ligger i en annan applikation/scope.
      #  2. Basic: gemensam inloggning LM_USER/LM_PASS (Geotorget).
      # Sätt dem INTE via Portainer "recreate": det tappar compose-aliaset
      # "laserdata" så att nginx inte längre kan nå tjänsten. Kör i stället
      # `docker compose up -d laserdata`.
      LM_OAUTH_KEY: "${LASERDATA_OAUTH_KEY:-${LM_OAUTH_KEY:-}}"
      LM_OAUTH_SECRET: "${LASERDATA_OAUTH_SECRET:-${LM_OAUTH_SECRET:-}}"
      LM_OAUTH_SCOPE: "${LASERDATA_OAUTH_SCOPE:-${LM_OAUTH_SCOPE:-}}"
      LM_OAUTH_TOKEN_URL: "${LM_OAUTH_TOKEN_URL:-https://apimanager.lantmateriet.se/oauth2/token}"
      LM_USER: "${LM_USER:-${LM_STAC_USER:-}}"
      LM_PASS: "${LM_PASS:-${LM_STAC_PASS:-}}"
      # Övre gränser: antal rutor per nedladdning resp. total zip-storlek (byte).
      MAX_FILES: "${LASERDATA_MAX_FILES:-200}"
      MAX_BYTES: "${LASERDATA_MAX_BYTES:-53687091200}"

  # Ortofoto-backend: söker Lantmäteriets STAC-bild för kartvyn och strömmar
  # valda ortofoton (GeoTIFF) som en zip. nginx proxar /api/ortofoto/ hit
  # (bakom inloggningen). Basic Auth läggs på server-side så uppgifterna aldrig
  # hamnar i klienten eller i git.
  ortofoto:
    build: ./ortofoto
    image: origo-ortofoto:latest
    container_name: origo-ortofoto
    restart: unless-stopped
    environment:
      # Era inloggningsuppgifter till Lantmäteriets STAC-bild-API (Basic Auth).
      # Sätt dem i en lokal .env-fil (se .env.example) — checka INTE in dem.
      # Sätt dem INTE via Portainer "recreate": det tappar compose-aliaset
      # "ortofoto" så att nginx inte längre kan nå tjänsten. Kör i stället
      # `docker compose up -d ortofoto`.
      # Gemensam Lantmäteri-inloggning (LM_USER/LM_PASS). Faller tillbaka på
      # det gamla LM_STAC_USER/LM_STAC_PASS om de fortfarande finns i .env.
      LM_USER: "${LM_USER:-${LM_STAC_USER:-}}"
      LM_PASS: "${LM_PASS:-${LM_STAC_PASS:-}}"
      # Övre gränser: antal rutor per nedladdning resp. total zip-storlek (byte).
      MAX_FILES: "${ORTOFOTO_MAX_FILES:-100}"
      MAX_BYTES: "${ORTOFOTO_MAX_BYTES:-53687091200}"

  # Jonosfär-proxy: lägger på Lantmäteriets Basic Auth server-side så att
  # användarnamn/lösenord aldrig hamnar i klienten eller i git.
  iono:
    image: python:3.12-alpine
    container_name: origo-iono
    restart: unless-stopped
    command: python /iono.py
    volumes:
      - ./iono/iono.py:/iono.py:ro
    environment:
      # Era inloggningsuppgifter till tjänsten "Jonosfär Direkt" (Lantmäteriet).
      # Sätt dem i en lokal .env-fil (se .env.example) — checka INTE in dem i git.
      # Sätt dem INTE via Portainer "recreate": det tappar compose-aliaset "iono"
      # så att nginx inte längre kan slå upp tjänsten (SERVFAIL). Kör i stället
      # `docker compose up -d iono` så att aliaset sätts korrekt.
      # Gemensam Lantmäteri-inloggning (LM_USER/LM_PASS). Faller tillbaka på
      # det gamla IONO_USER/IONO_PASS om de fortfarande finns i .env.
      LM_USER: "${LM_USER:-${IONO_USER:-}}"
      LM_PASS: "${LM_PASS:-${IONO_PASS:-}}"
      # Rutnätet: intervall i minuter (default 60 = en gång i timmen). Sätt
      # IONO_GRID_REFRESH_EVERY_MIN=0 och IONO_GRID_REFRESH_AT för fast klockslag.
      IONO_GRID_REFRESH_AT: "${IONO_GRID_REFRESH_AT:-07:00}"
      IONO_GRID_REFRESH_EVERY_MIN: "${IONO_GRID_REFRESH_EVERY_MIN:-60}"
      # 6-gradig skala på "variability" (mm): 0-5,5-10,10-15,15-20,20-25,25-30+.
      # BREAKS = övre gränser för de fem första klasserna; COLORS = sex färger.
      IONO_BREAKS: "${IONO_BREAKS:-5,10,15,20,25}"
      IONO_COLORS: "${IONO_COLORS:-#a6d96a,#2e9e3f,#f2c200,#fdae61,#e8602c,#d23c1e}"
      # Tidszon så att 07:00 blir svensk tid (kräver tzdata; annars UTC).
      TZ: "${TZ:-Europe/Stockholm}"

  # OAuth2-proxy mot Lantmäteriets API-portal (apimanager). Hämtar och cachar en
  # Bearer-token ur consumer key + secret (client credentials) och lägger på den
  # server-side på /proxy/lantmateriet/ (t.ex. Fastighetsindelning-WMS). Faller
  # tillbaka på en statisk LM_BEARER_TOKEN om key/secret saknas.
  lm-oauth:
    build: ./lm-oauth
    image: origo-lm-oauth:latest
    container_name: origo-lm-oauth
    restart: unless-stopped
    environment:
      # Applikationens Consumer Key + Consumer Secret från API-portalen.
      # Sätt dem i en lokal .env-fil (se .env.example) — checka INTE in dem.
      # Sätt dem INTE via Portainer "recreate": det tappar compose-aliaset
      # "lm-oauth" så att nginx inte längre kan nå tjänsten. Kör i stället
      # `docker compose up -d lm-oauth`.
      LM_OAUTH_KEY: "${LM_OAUTH_KEY:-}"
      LM_OAUTH_SECRET: "${LM_OAUTH_SECRET:-}"
      # Valfritt: scope (lämna tom om den inte krävs) och token-endpoint.
      LM_OAUTH_SCOPE: "${LM_OAUTH_SCOPE:-}"
      LM_OAUTH_TOKEN_URL: "${LM_OAUTH_TOKEN_URL:-https://apimanager.lantmateriet.se/oauth2/token}"
      # Fallback: statisk token om key/secret inte är satta (bakåtkompatibelt).
      LM_BEARER_TOKEN: "${LM_BEARER_TOKEN:-}"

  # Konverterar flyg-CSV:n till GeoJSON som origo serverar (drönarflyg-lagret).
  # Engångskörning vid 'up'. Kör om efter en ny CSV med:
  #   docker compose run --rm flights-convert
  # CSV-mappen och filnamnet sätts i .env (FLIGHTS_CSV_DIR / FLIGHTS_CSV_NAME).
  flights-convert:
    image: python:3.12-alpine
    container_name: origo-flights-convert
    restart: "no"
    volumes:
      - ./tools/flights_csv_to_geojson.py:/convert.py:ro
      - ${FLIGHTS_CSV_DIR:-/mnt/SSD250/flights}:/in:ro
      - ./flightdata:/out
    command: ["sh", "-c", "python /convert.py \"/in/${FLIGHTS_CSV_NAME:-DLB-Flights.csv}\" /out/drone-flights.geojson"]

  # PostGIS database backing the shared "Eget lager" layer.
  db:
    image: postgis/postgis:16-3.4
    container_name: origo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: origo
      POSTGRES_USER: origo
      POSTGRES_PASSWORD: origo
    volumes:
      - db-data:/var/lib/postgresql/data
      # Init scripts run only on a fresh (empty) data volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origo -d origo"]
      interval: 5s
      timeout: 5s
      retries: 20

  # GeoServer publishes eget_lager over WFS-T so the editor can read/write it.
  geoserver:
    image: docker.osgeo.org/geoserver:2.26.1
    container_name: origo-geoserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      SKIP_DEMO_DATA: "true"
      # GeoServer sits behind nginx at /proxy/geoserver; this keeps any
      # self-referencing URLs (e.g. WFS capabilities) pointing at the proxy.
      PROXY_BASE_URL: "http://localhost:8080/proxy/geoserver"
    volumes:
      - geoserver-data:/opt/geoserver_data

  # One-shot: creates the workspace, datastore and layer, then exits.
  geoserver-provision:
    image: curlimages/curl:8.10.1
    container_name: origo-geoserver-provision
    restart: "no"
    depends_on:
      - geoserver
    volumes:
      - ./geoserver/provision.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]
    environment:
      GS_URL: "http://geoserver:8080/geoserver"
      GS_USER: admin
      GS_PASS: geoserver
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: origo
      DB_USER: origo
      DB_PASS: origo

volumes:
  db-data:
  geoserver-data:
