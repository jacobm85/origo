# Loggrotation för samtliga tjänster. Docker roterar inte json-file-loggar som
# standard – i juni 2026 fyllde de disken och slog ut databasen i den fulla
# kartan. 10 MB x 3 filer per container räcker gott för felsökning och sätter
# samtidigt ett hårt tak per tjänst.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ---------------------------------------------------------------------------
# Sjökortsplotter – avskalad variant av kartan.
#
# Innehåller bara det plottern behöver: nginx som serverar appen, och
# session-auth framför den. Sjökortet hämtas som WMS direkt från
# Sjöfartsverket via nginx-proxyn /proxy/sjofartsverket/, så ingen GeoServer,
# PostGIS eller Lantmäteri-integration ingår. Spår, rutter och punkter sparas
# i webbläsarens localStorage – ingen serverdel behövs för dem.
#
# Den fulla kartan med samtliga lager och plugins ligger på grenen master.
# ---------------------------------------------------------------------------
services:
  origo:
    build: .
    image: origo-plotter:latest
    container_name: origo-plotter
    ports:
      # Publik port på hosten (vänster sida) sätts i .env via ORIGO_PORT.
      # Default 8080. Containern lyssnar alltid internt på 80.
      - "${ORIGO_PORT:-8080}:80"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      auth:
        condition: service_healthy
    environment:
      # Klientens fliktitel resp. text i footern. Lämna tom för att behålla
      # värdena från index.html resp. index.json. Renderas till
      # /usr/share/nginx/html/config.js vid containerstart.
      MAP_TITLE: "${MAP_TITLE:-}"
      MAP_FOOTER_TEXT: "${MAP_FOOTER_TEXT:-}"
      # Inloggningsskärmens rubrik (och fliktitel) samt valfri underrubrik.
      # Renderas in i login.html vid containerstart (25-render-login.sh).
      LOGIN_TITLE: "${LOGIN_TITLE:-Sjökortsplotter}"
      LOGIN_SUBTITLE: "${LOGIN_SUBTITLE:-}"

  # Tiny session-auth service: validates login POSTs and checks session cookies.
  # APP_USER / APP_PASSWORD control login credentials.
  auth:
    image: python:3.12-alpine
    container_name: origo-plotter-auth
    restart: unless-stopped
    logging: *default-logging
    command: python /auth.py
    volumes:
      - ./auth/auth.py:/auth.py:ro
    environment:
      APP_USER: "${APP_USER:-admin}"
      APP_PASSWORD: "${APP_PASSWORD:-origo}"
    healthcheck:
      # http.client returns a 401 response normally (no cookie) and only
      # raises if the server isn't accepting connections — so any HTTP
      # answer counts as healthy.
      test: ["CMD", "python", "-c", "import http.client as h; c=h.HTTPConnection('localhost',3000,timeout=2); c.request('GET','/auth/check'); c.getresponse()"]
      interval: 10s
      timeout: 3s
      retries: 5
