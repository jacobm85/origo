services:
  origo:
    build: .
    image: origo:latest
    container_name: origo
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      geoserver:
        condition: service_started
      auth:
        condition: service_healthy
      laserdata:
        condition: service_started
      iono:
        condition: service_started
    environment:
      # OAuth2 Bearer token for Lantmateriet's API Portal (apimanager.lantmateriet.se).
      # Injected by nginx into the Authorization header on every /proxy/lantmateriet/*
      # request so the token never leaves the container.
      # Set the real value in a local .env file (see .env.example) — never in git.
      LM_BEARER_TOKEN: "${LM_BEARER_TOKEN:-}"

  # Tiny session-auth service: validates login POSTs and checks session cookies.
  # APP_USER / APP_PASSWORD control login credentials.
  auth:
    image: python:3.12-alpine
    container_name: origo-auth
    restart: unless-stopped
    command: python /auth.py
    volumes:
      - ./auth/auth.py:/auth.py:ro
    environment:
      APP_USER: "${APP_USER:-admin}"
      APP_PASSWORD: "${APP_PASSWORD:-origo}"
    healthcheck:
      # http.client returns a 401 response normally (no cookie) and only
      # raises if the server isn't accepting connections — so any HTTP
      # answer counts as healthy.
      test: ["CMD", "python", "-c", "import http.client as h; c=h.HTTPConnection('localhost',3000,timeout=2); c.request('GET','/auth/check'); c.getresponse()"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Laserdata-backend: paketerar valda LAZ-filer som en zip-ström.
  # nginx proxar /api/laserdata/ hit (bakom inloggningen).
  laserdata:
    build: ./laserdata
    image: origo-laserdata:latest
    container_name: origo-laserdata
    restart: unless-stopped
    environment:
      # Katalogen *inuti* containern där LAZ-filerna nås. Montera er NAS-/
      # datakatalog via volumes nedan och peka LASERDATA_ROOT på den.
      LASERDATA_ROOT: "/data/laserdata"
      LASERDATA_PATTERN: "{id}.laz"
      # MAX_BYTES: "53687091200"   # 50 GB – höj/sänk vid behov
      # MAX_CELLS: "200"
    volumes:
      # Byt vänster sida mot er riktiga NAS-/datakatalog med LAZ-filer.
      - ./data/laserdata:/data/laserdata:ro

  # Jonosfär-proxy: lägger på Lantmäteriets Basic Auth server-side så att
  # användarnamn/lösenord aldrig hamnar i klienten eller i git.
  iono:
    image: python:3.12-alpine
    container_name: origo-iono
    restart: unless-stopped
    command: python /iono.py
    volumes:
      - ./iono/iono.py:/iono.py:ro
    environment:
      # Era inloggningsuppgifter till tjänsten "Jonosfär Direkt" (Lantmäteriet).
      # Sätt dem i en lokal .env-fil (se .env.example) — checka INTE in dem i git.
      # Sätt dem INTE via Portainer "recreate": det tappar compose-aliaset "iono"
      # så att nginx inte längre kan slå upp tjänsten (SERVFAIL). Kör i stället
      # `docker compose up -d iono` så att aliaset sätts korrekt.
      IONO_USER: "${IONO_USER:-}"
      IONO_PASS: "${IONO_PASS:-}"

  # PostGIS database backing the shared "Eget lager" layer.
  db:
    image: postgis/postgis:16-3.4
    container_name: origo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: origo
      POSTGRES_USER: origo
      POSTGRES_PASSWORD: origo
    volumes:
      - db-data:/var/lib/postgresql/data
      # Init scripts run only on a fresh (empty) data volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origo -d origo"]
      interval: 5s
      timeout: 5s
      retries: 20

  # GeoServer publishes eget_lager over WFS-T so the editor can read/write it.
  geoserver:
    image: docker.osgeo.org/geoserver:2.26.1
    container_name: origo-geoserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      SKIP_DEMO_DATA: "true"
      # GeoServer sits behind nginx at /proxy/geoserver; this keeps any
      # self-referencing URLs (e.g. WFS capabilities) pointing at the proxy.
      PROXY_BASE_URL: "http://localhost:8080/proxy/geoserver"
    volumes:
      - geoserver-data:/opt/geoserver_data

  # One-shot: creates the workspace, datastore and layer, then exits.
  geoserver-provision:
    image: curlimages/curl:8.10.1
    container_name: origo-geoserver-provision
    restart: "no"
    depends_on:
      - geoserver
    volumes:
      - ./geoserver/provision.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]
    environment:
      GS_URL: "http://geoserver:8080/geoserver"
      GS_USER: admin
      GS_PASS: geoserver
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: origo
      DB_USER: origo
      DB_PASS: origo

volumes:
  db-data:
  geoserver-data:
